[project]
name = "docpilot-backend"
version = "0.1.0"
description = "DocPilot agent backend, ingestion and MCP server"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.21.0",
    "uvicorn>=0.54.0",
]

# Installing backend as a package (editable, via `uv sync`) makes `app` and `ingest`
# importable from mcp_server/, eval/ and data/seed/ without sys.path hacks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
eval = [
    "langchain-community<0.4",
    "ragas>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../mcp_server/tests"]
pythonpath = ["../mcp_server", "tests"]  # `import tools` and the shared test fixtures
asyncio_mode = "auto"
