services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docpilot-db
    environment:
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
      POSTGRES_DB: docpilot
    ports:
      - "5433:5432"   # host 5433 avoids clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot -d docpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
